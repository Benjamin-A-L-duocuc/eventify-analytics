<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="flechaAzul" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .titulo { font: bold 24px Arial, sans-serif; fill: #0f172a; }
      .subtitulo { font: 14px Arial, sans-serif; fill: #475569; }
      .caja { stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .capa { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 8; }
      .texto { font: 15px Arial, sans-serif; fill: #1e293b; }
      .textoPeq { font: 12px Arial, sans-serif; fill: #475569; }
      .textoBlanco { font: bold 16px Arial, sans-serif; fill: #ffffff; }
      .flecha { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#flecha); }
      .flechaAzul { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#flechaAzul); }
    </style>
  </defs>

  <text x="500" y="40" text-anchor="middle" class="titulo">Arquitectura de Eventify Analytics</text>
  <text x="500" y="66" text-anchor="middle" class="subtitulo">Streamlit -> FastAPI -> MongoDB Atlas</text>

  <!-- Usuario -->
  <rect x="30" y="205" width="120" height="90" class="caja" fill="#ffffff"/>
  <text x="90" y="238" text-anchor="middle" class="texto">Usuario</text>
  <text x="90" y="260" text-anchor="middle" class="textoPeq">navegador</text>

  <!-- Streamlit -->
  <rect x="200" y="170" width="220" height="160" class="caja" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="310" y="200" text-anchor="middle" class="texto" font-weight="bold">Streamlit</text>
  <text x="310" y="224" text-anchor="middle" class="textoPeq">frontend/app.py</text>
  <text x="310" y="248" text-anchor="middle" class="textoPeq">api_client.py</text>
  <text x="310" y="276" text-anchor="middle" class="textoPeq">KPIs</text>
  <text x="310" y="296" text-anchor="middle" class="textoPeq">4 consultas</text>
  <text x="310" y="316" text-anchor="middle" class="textoPeq">panel CRUD</text>

  <!-- FastAPI -->
  <rect x="480" y="120" width="300" height="270" class="caja" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="630" y="150" text-anchor="middle" class="texto" font-weight="bold">FastAPI</text>
  <text x="630" y="170" text-anchor="middle" class="textoPeq">backend/main.py</text>

  <rect x="500" y="185" width="260" height="50" class="capa"/>
  <text x="630" y="206" text-anchor="middle" class="texto">Controllers</text>
  <text x="630" y="224" text-anchor="middle" class="textoPeq">rutas HTTP y validación</text>

  <rect x="500" y="248" width="260" height="50" class="capa"/>
  <text x="630" y="269" text-anchor="middle" class="texto">Services</text>
  <text x="630" y="287" text-anchor="middle" class="textoPeq">negocio y agregaciones</text>

  <rect x="500" y="311" width="260" height="50" class="capa"/>
  <text x="630" y="332" text-anchor="middle" class="texto">Models</text>
  <text x="630" y="350" text-anchor="middle" class="textoPeq">Pydantic + PyObjectId</text>

  <!-- MongoDB -->
  <path d="M840,190 C840,170 970,170 970,190 L970,310 C970,330 840,330 840,310 Z" class="caja" fill="#fef2f2" stroke="#ef4444"/>
  <ellipse cx="905" cy="190" rx="65" ry="18" class="caja" fill="#fee2e2" stroke="#ef4444"/>
  <text x="905" y="235" text-anchor="middle" class="texto" font-weight="bold">MongoDB Atlas</text>
  <text x="905" y="258" text-anchor="middle" class="textoPeq">eventify_db</text>
  <text x="905" y="282" text-anchor="middle" class="textoPeq">usuarios · eventos</text>
  <text x="905" y="300" text-anchor="middle" class="textoPeq">ordenes · resenas</text>

  <!-- Flechas -->
  <line x1="150" y1="250" x2="198" y2="250" class="flecha"/>
  <text x="174" y="240" text-anchor="middle" class="textoPeq">UI</text>

  <line x1="422" y1="250" x2="478" y2="250" class="flechaAzul"/>
  <text x="450" y="240" text-anchor="middle" class="textoPeq">REST / JSON</text>

  <line x1="782" y1="250" x2="838" y2="250" class="flecha"/>
  <text x="810" y="240" text-anchor="middle" class="textoPeq">PyMongo</text>

  <!-- Nota -->
  <rect x="200" y="390" width="580" height="70" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="490" y="418" text-anchor="middle" class="texto" font-weight="bold">Separación de responsabilidades</text>
  <text x="490" y="442" text-anchor="middle" class="textoPeq">Streamlit no se conecta directamente a MongoDB: toda la lectura y escritura pasa por la API REST.</text>
</svg>
